                      - heading "Sequence of Interactions" [level=3] [ref=e774]
                      - paragraph [ref=e775]: "The following are the sequence of interactions to retrieve worker demographic information for a collection of workers:"
                      - list [ref=e776]:
                        - listitem [ref=e777]: Your consumer application makes a request for an initial collection of workers to the ADP API endpoint.
                        - listitem [ref=e778]: The ADP API endpoint responds to your consumer application with a collection of workers.
                        - listitem [ref=e779]: Your consumer application makes a request for a subsequent collection of workers to the ADP API endpoint.
                        - listitem [ref=e780]: The ADP API endpoint responds to your consumer application with a collection of workers.
                      - paragraph [ref=e781]: Your consumer application repeats steps 3 and 4 until a 204 No Content HTTP response status code is returned.
