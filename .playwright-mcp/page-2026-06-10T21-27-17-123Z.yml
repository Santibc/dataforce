                        - listitem [ref=e195]: Retrieve worker information change notifications
                      - heading "About Basic Worker Demographic Information" [level=4] [ref=e196]
                      - paragraph [ref=e197]: "If your application requires basic worker demographic information without Personally Identifiable Information (PII) and Sensitive Personal Information (SPI) data listed in the following tables, ADP provides APIs you can implement to access that information. Worker demographic information commonly requested includes the following:"
                      - list [ref=e198]:
                        - listitem [ref=e199]: Name
                        - listitem [ref=e200]: Address
                        - listitem [ref=e201]: Communication profile
                        - listitem [ref=e202]: Hire date
                        - listitem [ref=e203]: Work status
                        - listitem [ref=e204]: Work assignment information (such as job title, manager/reports to information, and custom fields)
                      - heading "About Full Worker Information" [level=4] [ref=e205]
                      - paragraph [ref=e206]: If your application requires Personally Identifiable Information (PII) and Sensitive Personal Information (SPI) data, in addition to the information included in Basic Worker Demographic Information, then ADP provides a separate set of APIs you can leverage.
