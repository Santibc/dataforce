                      - heading "Summary" [level=3] [ref=e140]:
                        - strong [ref=e141]: Summary
                      - paragraph [ref=e142]: The Worker Management Application Programming Interface (API) supports the management of workers in an organization. It can be used to obtain a list of all workers in an organization and to get information about work assignments.
                      - paragraph [ref=e143]: A worker is defined as a person who performs duties and responsibilities for an organization. In that capacity, a worker fills one or more positions through a work assignment. For a given work assignment, a worker is related to the organization as an employee or contractor.
                      - paragraph [ref=e144]:
                        - text: The Worker Management API Guide for Enterprise HR describes how your application can access and manage information about workers in the application. It helps you to determine which use case best meets your business needs. It also guides you through the implementation of each use case.
                        - strong [ref=e145]: What's New in this Guide?
                      - paragraph [ref=e146]: "Following new fields are added to GET hr/v2/workers/{AOID} API . Updated Data Dictionary and examples."
