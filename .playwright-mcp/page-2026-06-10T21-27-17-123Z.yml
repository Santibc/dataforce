                      - paragraph [ref=e543]: "The following are the sequence of interactions to retrieve worker information for a collection of workers:"
                      - list [ref=e544]:
                        - listitem [ref=e545]: Your consumer application makes a request for an initial collection of workers to the ADP API endpoint.
                        - listitem [ref=e546]: The ADP API endpoint responds to your consumer application with a collection of workers.
                        - listitem [ref=e547]: Your consumer application makes a request for a subsequent collection of workers to the ADP API endpoint.
                        - listitem [ref=e548]: The ADP API endpoint responds to your consumer application with a collection of workers.
                      - paragraph [ref=e549]: Your consumer application repeats steps 3 and 4 until a 204 No Content HTTP response status code is returned.
